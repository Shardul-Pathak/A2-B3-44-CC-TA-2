AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TA-2 - Event-driven serverless file processing. An upload to S3 triggers a
  Lambda function running in a private VPC subnet, which writes a metadata log
  back to S3 and publishes an execution summary to an SNS topic (email alert).

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives the SNS notification (you must confirm the subscription).
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Must be a valid email address.
  ProjectName:
    Type: String
    Default: ta2-file-processing
    Description: Lower-case prefix used to name resources (letters, digits, hyphens).
    AllowedPattern: '^[a-z0-9][a-z0-9-]{2,30}$'
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24

Resources:
  # ------------------------------------------------------------------
  # Networking
  # ------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-subnet'

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-subnet'

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat-eip'

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-rt'

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # (Optional) S3 Gateway endpoint: private S3 access, not over the NAT/internet
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the file-processing Lambda (outbound only)
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-lambda-sg'

  # ------------------------------------------------------------------
  # Messaging (SNS)
  # ------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts
      DisplayName: File Processing Alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ------------------------------------------------------------------
  # IAM (Lambda execution role)
  # NOTE: bucket ARN is built from a string (not !GetAtt) to avoid a
  # circular dependency: Bucket -> Lambda -> Role -> Bucket.
  # ------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: S3ReadWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-files-${AWS::AccountId}-${AWS::Region}/*'
        - PolicyName: SnsPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  # ------------------------------------------------------------------
  # Compute (Lambda in the private subnet)
  # ------------------------------------------------------------------
  ProcessingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-processor'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          TOPIC_ARN: !Ref AlertTopic
          OUTPUT_PREFIX: processed/
      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          from datetime import datetime, timezone

          import boto3

          s3 = boto3.client("s3")
          sns = boto3.client("sns")

          TOPIC_ARN = os.environ["TOPIC_ARN"]
          OUTPUT_PREFIX = os.environ.get("OUTPUT_PREFIX", "processed/")


          def lambda_handler(event, context):
              results = []
              for record in event.get("Records", []):
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])

                  # Safety guard: never re-process our own output files
                  if key.startswith(OUTPUT_PREFIX):
                      print(f"Skipping output object {key}")
                      continue

                  head = s3.head_object(Bucket=bucket, Key=key)
                  meta = {
                      "bucket": bucket,
                      "key": key,
                      "size_bytes": head["ContentLength"],
                      "content_type": head.get("ContentType"),
                      "etag": head.get("ETag"),
                      "event_name": record.get("eventName"),
                      "processed_at": datetime.now(timezone.utc).isoformat(),
                      "request_id": context.aws_request_id,
                  }

                  out_key = f"{OUTPUT_PREFIX}{key}.metadata.json"
                  s3.put_object(
                      Bucket=bucket,
                      Key=out_key,
                      Body=json.dumps(meta, indent=2).encode("utf-8"),
                      ContentType="application/json",
                  )

                  message = (
                      "File processed successfully.\n\n"
                      f"Bucket       : {bucket}\n"
                      f"Object key   : {key}\n"
                      f"Size (bytes) : {meta['size_bytes']}\n"
                      f"Content-Type : {meta['content_type']}\n"
                      f"Metadata log : s3://{bucket}/{out_key}\n"
                      f"Processed at : {meta['processed_at']}\n"
                  )
                  sns.publish(
                      TopicArn=TOPIC_ARN,
                      Subject=f"File processed: {key}"[:100],
                      Message=message,
                  )
                  results.append(out_key)

              return {"statusCode": 200, "processed": results}

  # Resource-based policy: lets S3 invoke the function
  S3InvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessingFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-files-${AWS::AccountId}-${AWS::Region}'

  # ------------------------------------------------------------------
  # Storage (S3) + event notification
  # ------------------------------------------------------------------
  FileBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3InvokeLambdaPermission
    Properties:
      BucketName: !Sub '${ProjectName}-files-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt ProcessingFunction.Arn
            Filter:
              S3Key:
                Rules:
                  # Only trigger for uploads/ so the Lambda's own writes to
                  # processed/ cannot cause an infinite loop.
                  - Name: prefix
                    Value: uploads/

Outputs:
  BucketName:
    Description: Upload test files to the uploads/ prefix of this bucket
    Value: !Ref FileBucket
  LambdaFunctionName:
    Value: !Ref ProcessingFunction
  SnsTopicArn:
    Value: !Ref AlertTopic
  VpcId:
    Value: !Ref VPC
  PrivateSubnetId:
    Value: !Ref PrivateSubnet
